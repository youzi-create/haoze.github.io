<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生信息管理</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">学生信息页面</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" href="index.html">首页</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="about.html">关于</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="table.html">表单</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>学生信息表</h2>
      <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addStudentModal">
        + 增加学生
      </button>
    </div>

    <table class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr>
          <th>姓名</th>
          <th>学号</th>
          <th>班级</th>
          <th class="text-center">操作</th>
        </tr>
      </thead>
      <tbody id="studentTableBody">
        <tr>
          <td>黄浩泽</td>
          <td>109092024010</td>
          <td>地信24</td>
          <td class="text-center">
            <button class="btn btn-sm btn-danger delete-btn">删除</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- 增加学生的模态框 -->
  <div class="modal fade" id="addStudentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">添加学生</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="studentName" class="form-label">姓名</label>
            <input type="text" class="form-control" id="studentName" placeholder="请输入姓名">
          </div>
          <div class="mb-3">
            <label for="studentId" class="form-label">学号</label>
            <input type="text" class="form-control" id="studentId" placeholder="请输入学号">
          </div>
          <div class="mb-3">
            <label for="studentClass" class="form-label">班级</label>
            <input type="text" class="form-control" id="studentClass" placeholder="请输入班级">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary" id="confirmAdd">确认添加</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script>
    // 简单的 XSS 防护：转义 HTML 特殊字符
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 删除功能：为表格中已有的删除按钮绑定事件
    document.getElementById('studentTableBody').addEventListener('click', function (e) {
      if (e.target.classList.contains('delete-btn')) {
        if (confirm('确定要删除这位学生吗？')) {
          const row = e.target.closest('tr');
          row.remove();
        }
      }
    });

    // 增加功能：点击确认添加按钮时执行
    document.getElementById('confirmAdd').addEventListener('click', function () {
      const nameInput = document.getElementById('studentName');
      const idInput = document.getElementById('studentId');
      const classInput = document.getElementById('studentClass');
      const name = nameInput.value.trim();
      const id = idInput.value.trim();
      const cls = classInput.value.trim();

      if (!name || !id || !cls) {
        alert('请完整填写所有字段！');
        return;
      }

      const tbody = document.getElementById('studentTableBody');
      const newRow = document.createElement('tr');

      newRow.innerHTML = `
        <td>${escapeHtml(name)}</td>
        <td>${escapeHtml(id)}</td>
        <td>${escapeHtml(cls)}</td>
        <td class="text-center">
          <button class="btn btn-sm btn-danger delete-btn">删除</button>
        </td>
      `;

      tbody.appendChild(newRow);

      // 清空输入框
      nameInput.value = '';
      idInput.value = '';
      classInput.value = '';

      // 关闭模态框（兼容处理）
      const modalEl = document.getElementById('addStudentModal');
      try {
        if (typeof bootstrap !== 'undefined' && bootstrap.Modal) {
          const modal = bootstrap.Modal.getInstance(modalEl);
          if (modal) {
            modal.hide();
          }
        }
      } catch (e) {
        // 如果 Bootstrap 方法不可用，尝试通过 DOM 关闭
        console.warn('Bootstrap modal hide failed:', e);
      }

      alert('添加成功！');
    });
  </script>
</body>

</html>
